<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >
        <title>Workout Tracker</title>

        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="./css/responsive.css">
    </head>
    <body>
        <div class="app">
            <header class="app-header">
                <div>
                    <p class="eyebrow">Workout Tracker</p>
                    <h1 id="page-title" data-i18n="pageTitle">训练设置</h1>
                </div>

                <button id="language-btn" class="icon-btn" type="button">EN</button>
            </header>

            <main class="app-main">
                <!-- Today -->
                <section id="today-page" class="page" data-page="today">
                    <h2 data-i18n="today">今日训练</h2>
                    <p>Today 页面</p>
                </section>

                <!-- Weekly Plan -->
                <section id="weekly-page" class="page" data-page="weekly">
                    <h2 data-i18n="weeklyPlan">每周计划</h2>
                    <p>Weekly Plan 页面</p>
                </section>

                <!-- History -->
                <section id="history-page" class="page" data-page="history">
                    <h2 data-i18n="history">训练记录</h2>
                    <p>History 页面</p>
                </section>

                <!-- Settings -->
                <section id="settings-page" class="page" data-page="settings">
                    <section class="settings-section">
                        <div class="section-heading">
                            <div>
                                <h2 data-i18n="defaultExercises">默认训练动作</h2>
                                <p data-i18n="description">这些动作会显示在新的训练记录中。</p>
                            </div>

                            <button id="add-exercise-btn" class="primary-btn" type="button" data-i18n="addExercise">
                                + 添加动作
                            </button>
                        </div>

                        <div id="exercise-list" class="exercise-list"></div>

                        <div class="settings-actions">
                            <button id="save-settings-btn" class="primary-btn" type="button" data-i18n="saveSettings">
                                保存设置
                            </button>

                            <button id="reset-settings-btn" class="secondary-btn" type="button" data-i18n="resetSettings">
                                恢复默认
                            </button>
                        </div>

                        <p id="settings-message" class="settings-message"></p>
                    </section>
                </section>
            </main>

            <!-- Bottom Navigation -->
            <nav class="bottom-nav">
                <button class="nav-btn" type="button" data-target="today">
                    <span class="nav-icon">🏠</span>
                    <span data-i18n="today">今日训练</span>
                </button>

                <button class="nav-btn" type="button" data-target="weekly">
                    <span class="nav-icon">📅</span>
                    <span data-i18n="weeklyPlan">周计划</span>
                </button>

                <button class="nav-btn" type="button" data-target="history">
                    <span class="nav-icon">📋</span>
                    <span data-i18n="history">记录</span>
                </button>

                <button class="nav-btn active" type="button" data-target="settings">
                    <span class="nav-icon">⚙️</span>
                    <span data-i18n="settings">设置</span>
                </button>
            </nav>
        </div>

        <template id="exercise-card-template">
            <article class="exercise-card">
                <div class="exercise-card-header">
                    <h3 class="exercise-number">动作</h3>

                    <button class="delete-exercise-btn" type="button" data-i18n="delete">删除</button>
                </div>

                <div class="form-grid">
                    <label>
                        <span class="exercise-name-label" data-i18n="exerciseName">动作名称</span>
                        <input
                            class="exercise-name"
                            type="text"
                            data-i18n-placeholder="exercisePlaceholder"
                            placeholder="例如：俯卧撑"
                        >
                    </label>

                    <label>
                        <span class="exercise-sets-label" data-i18n="sets">组数</span>
                        <input
                            class="exercise-sets"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </label>

                    <label>
                        <span data-i18n="valuePerSet">
                            每组次数
                        </span>
                        
                        <input class="exercise-value" type="number" min="1" inputmode="numeric">
                    </label>

                    <label>
                        <span data-i18n="trackingType">
                            记录类型
                        </span>
                        <select class="exercise-type">
                            <option value="reps" data-i18n="reps">次数</option>
                            <option value="duration" data-i18n="duration">时长</option>
                        </select>
                    </label>

                    <label>
                        <span class="exercise-unit-label" data-i18n="unit">单位</span>
                        <input
                            class="exercise-unit"
                            type="text"
                            data-i18n-placeholder="unitPlaceholder"
                            placeholder="次"
                        >
                    </label>
                </div>
            </article>
        </template>
        
        <script src="./js/app.js" type="module"></script>
    </body>
</html>
