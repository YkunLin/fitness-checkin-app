<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >
        <title>Workout Tracker</title>

        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="./css/responsive.css">
    </head>
    <body>
        <div class="app">
            <header class="app-header">
                <div>
                    <p class="eyebrow">Workout Tracker</p>
                    <h1>训练设置</h1>
                </div>

                <button id="language-btn" class="icon-btn" type="button">EN</button>
            </header>

            <main class="app-main">
                <section class="settings-section">
                    <div class="section-heading">
                        <div>
                            <h2>默认训练动作</h2>
                            <p>这些动作会显示在新的训练记录中。</p>
                        </div>

                        <button id="add-exercise-btn" class="primary-btn" type="button">
                            + 添加动作
                        </button>
                    </div>

                    <div id="exercise-list" class="exercise-list"></div>

                    <div class="settings-actions">
                        <button id="save-settings-btn" class="primary-btn" type="button">
                            保存设置
                        </button>

                        <button id="reset-settings-btn" class="secondary-btn" type="button">
                            恢复默认
                        </button>
                    </div>

                    <p id="settings-message" class="settings-message"></p>
                </section>
            </main>
        </div>

        <template id="exercise-card-template">
            <article class="exercise-card">
                <div class="exercise-card-header">
                    <h3 class="exercise-number">动作</h3>

                    <button class="delete-exercise-btn" type="button">删除</button>
                </div>

                <div class="form-grid">
                    <label>
                        <span class="exercise-name-label">动作名称</span>
                        <input
                            class="exercise-name"
                            type="text"
                            placeholder="例如：俯卧撑"
                        >
                    </label>

                    <label>
                        <span class="exercise-sets-label">组数</span>
                        <input
                            class="exercise-sets"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </label>

                    <label>
                        每组次数
                        <input class="exercise-value" type="number" min="1" inputmode="numeric">
                    </label>

                    <label>
                        记录类型
                        <select class="exercise-type">
                            <option value="reps">次数</option>
                            <option value="duration">时长</option>
                        </select>
                    </label>

                    <label>
                        <span class="exercise-unit-label">单位</span>
                        <input
                            class="exercise-unit"
                            type="text"
                            placeholder="次"
                        >
                    </label>
                </div>
            </article>
        </template>
        
        <script src="./js/app.js" type="module"></script>
    </body>
</html>
